org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pub cache is on C: while the project is on E:. Kotlin 2.1's incremental compiler then fails with
# "this and base files have different roots". Disable incremental Kotlin until PUB_CACHE is on the same drive.
kotlin.incremental=false
